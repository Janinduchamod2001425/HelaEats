apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: your-registry/auth-service:1.0.0
          ports:
            - containerPort: 5001  # Updated port
          env:
            - name: PORT
              value: "5001"  # Explicitly set in container
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
            - name: MONGO_URI
              value: "mongodb+srv://janiduchamod25:123@auth-service.xadn0ml.mongodb.net/?retryWrites=true&w=majority&appName=Auth-Service"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001  # Updated port
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5001  # Updated port
            initialDelaySeconds: 5
            periodSeconds: 5

